<!DOCTYPE html>
<html>
<head>
  <!--page title-->
  <title>Login</title>

  <!--link to shared css file-->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page">

  <!--main login container-->
  <div class="login-box">

    <!--page heading-->
    <h2>Login</h2>

    <!--error message if login fails-->
    {% if error %}
      <p class="error-text">
        {{ error }}
      </p>
    {% endif %}

    <!--login form-->
    <form method="post">

      <!--username input-->
      <input
        type="text"
        name="username"
        placeholder="Username"
        class="field"
        autocomplete="username"
        required
      >

      <!--password input-->
      <input
        type="password"
        name="password"
        placeholder="Password"
        class="field"
        autocomplete="current-password"
        required
      >

      <!--submit button-->
      <button type="submit" class="login-btn">Login</button>

    </form>

    <!--link to signup page-->
      <a href="/signup" class="link">Sign up</a>
    </p>

  </div>

</body>
</html>
