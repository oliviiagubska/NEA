<!DOCTYPE html>
<html>
<head>
  <!--page title-->
  <title>Members</title>

  <!--link to shared css-->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="members-page-body">

  <!--back to dashboard link-->
  <div class="members-back-wrapper">
    <a href="/app" class="members-back-link">
      ← Back to Dashboard
    </a>
  </div>

  <!--main container-->
  <div class="members-container">

    <!--team title-->
    <h1>Your team:</h1>
    <h2>{{ team_name }}</h2>

    <!--members list-->
    <div class="members-list">

      <!--team owner-->
      <div class="members-item owner">
        {{ owner }} (Owner)
      </div>

      <!--team members-->
      {% for m in members %}
        {% if m != owner %}
          <div class="members-item">
            {{ m }}
          </div>
        {% endif %}
      {% endfor %}

    </div>

  </div>

</body>
</html>
