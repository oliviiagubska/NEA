<!DOCTYPE html>
<html>
<head>
  <title>Team Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
    }


    .member-body {
      background: #38406f; 
    }

    .top-box {
      margin-top: 40px;
      background: rgba(255,255,255,.08);
      border: 2px solid rgba(255,255,255,.6);
      border-radius: 16px;
      padding: 22px;
      width: 700px;
      max-width: 90%;
      text-align: center;
    }

    .date-t { font-size: 16px; opacity: .85; margin-bottom: 8px }
    .greet-t { font-size: 26px; font-weight: 700; margin-bottom: 16px }

    .team-name { font-weight: 700; margin-bottom: 6px; color: #d2b9ff }
    .team-code { font-size: 14px; opacity: .9 }

    .role-banner {
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 999px;
      display: inline-block;
      font-size: 14px;
      background: rgba(16,185,129,0.18);
      border: 1px solid rgba(16,185,129,0.9);
    }

   

    .menu {
      margin-top: 30px;
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu li { text-align: center }

    .menu a {
      display: inline-block;
      background: #ff69b4;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s;
    }

    .menu a:hover {
      background: #ff85c1;
    }

    .role-badge {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(255,255,255,0.12);
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #ffffff;
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(6px);
}

  </style>
</head>
<body class="member-body">
    <div class="role-badge">MEMBER</div>
  <div class="top-box">
    <div class="date-t">{{ date_today }}</div>
    <div class="greet-t">{{ greeting }}, {{ username }}!</div>
    <div class="team-name">{{ team.name }}</div>
    <div class="team-code">Invite code: <b>{{ team.code }}</b></div>





  <ul class="menu">
    <li><a href="/inbox">Inbox</a></li>
    <li><a href="/projects">Projects & Tasks</a></li>
    <li><a href="{{ url_for('members') }}">Members</a></li>
    <li><a href="/notifications">Notifications</a></li>
  </ul>
</body>
</html>
