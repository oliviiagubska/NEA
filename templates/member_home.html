<!DOCTYPE html>
<html>
<head>
  <!--page title-->
  <title>Team Dashboard</title>

  <!--link to the general css-->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="member-page">

  <!--role badge at the top left-->
  <div class="member-role-badge">
    MEMBER
  </div>

  <!--progress bar-->
  <div class="member-progress-wrapper">
    <div class="member-progress-bar">

      {% if total_tasks == 0 %}
        <span class="member-progress-text">You have no tasks yet</span>
      {% else %}
        <div class="member-progress-fill" style="width: {{ progress_percent }}%;"></div>
        <span class="member-progress-text">{{ done_tasks }}/{{ total_tasks }} done ({{ progress_percent }}%)</span>
      {% endif %}

    </div>
  </div>

  <!--main dashboard content-->
  <div class="member-top-box">
    <div class="member-date">
      {{ date_today }}</div>
    <div class="member-greeting">{{ greeting }}, {{ username }}!</div>
    <div class="member-team-name">{{ team.name }}</div>

    <!--to show owner not invite code-->
    <div class="member-team-owner">Owner: <b>{{ team.owner }}</b></div>

    <ul class="member-menu">
      <li>
        <a href="/inbox" class="member-menu-link">Inbox</a>
      </li>
      <li>
        <a href="/projects" class="member-menu-link">Projects & Tasks</a>
      </li>
      <li>
        <a href="{{ url_for('members') }}" class="member-menu-link">Members</a>
      </li>
      <li>
        <a href="/notifications" class="member-menu-link">Notifications</a>
      </li>
    </ul>
  </div>

</body>
</html>
