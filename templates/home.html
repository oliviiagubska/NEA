<!DOCTYPE html>
<html>
<head>
  <title>Collabsy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#0e0e44;color:#fff;font-family:'Poppins',sans-serif}
    .wrap{text-align:center}
    .welcome-title{font-size:40px;font-weight:700;margin-bottom:30px}
    .welcome-title span{color:#d2b9ff}
    .buttons{display:flex;gap:16px;justify-content:center}
    .btn{background:#ff69b4;color:#fff;padding:10px 20px;border-radius:25px;text-decoration:none;font-weight:600}
    .btn:hover{background:#ff85c1}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="welcome-title">Welcome to <span>Collabsy</span></h1>
    <div class="buttons">
      <a class="btn" href="/login">Log In</a>
      <a class="btn" href="/signup">Sign Up</a>
    </div>
  </div>
</body>
</html>
